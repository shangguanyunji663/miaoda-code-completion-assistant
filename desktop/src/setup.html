<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>妙答 · 首次配置</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 32px; font-family: "Microsoft YaHei", system-ui, sans-serif;
    background: #f5f7fb; color: #1f2733;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: #5a6572; font-size: 13px; line-height: 1.7; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .hint { font-weight: 400; color: #8a94a0; margin-left: 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cdd5df;
    border-radius: 8px; background: #fff; outline: none;
  }
  input:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.15); }
  button {
    margin-top: 26px; width: 100%; padding: 12px; font-size: 15px; font-weight: 700;
    color: #fff; background: #2f6fed; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { background: #9db7f5; cursor: wait; }
  .warn { margin-top: 18px; padding: 10px 12px; background: #fff7e6; border: 1px solid #ffe1a6;
    border-radius: 8px; font-size: 12.5px; color: #8a6116; line-height: 1.7; }
  .done { color: #1a7f37; font-weight: 600; }
</style>
</head>
<body>
  <h1>妙答 · 首次配置</h1>
  <p class="sub">只需要填一次。这三项由发你工具的人提供；填完点「保存并启动」，之后每天双击妙答图标即可。</p>

  <label>AI 端点地址<span class="hint">OpenAI 兼容端点，一般以 /v1 结尾</span></label>
  <input id="baseUrl" placeholder="https://xxx.xxx/v1" spellcheck="false" />

  <label>AI 密钥<span class="hint">形如 sk-xxxx 的一长串，等同密码</span></label>
  <input id="apiKey" placeholder="sk-..." spellcheck="false" type="password" />

  <label>模型名<span class="hint">不确定就填发你工具的人给的那个</span></label>
  <input id="model" placeholder="模型名称" spellcheck="false" />

  <button id="save">保存并启动</button>
  <div class="warn" id="status">三件套只保存在你电脑的 agent/.env.local 里，不外发、不上传。</div>

  <script>
    const $ = (id) => document.getElementById(id);
    $('save').addEventListener('click', async () => {
      const cfg = {
        AI_BASE_URL: $('baseUrl').value.trim(),
        AI_API_KEY: $('apiKey').value.trim(),
        AI_MODEL: $('model').value.trim(),
      };
      const missing = Object.entries(cfg).filter(([, v]) => !v).map(([k]) => k);
      if (missing.length) {
        $('status').textContent = '还有未填项：' + missing.join('、');
        $('status').classList.add('done');
        $('status').style.color = '#c0392b';
        return;
      }
      $('save').disabled = true;
      $('status').textContent = '正在保存…';
      await window.miaoda.saveConfig(cfg);
      $('status').textContent = '✓ 已保存，正在启动妙答…';
      $('status').style.color = '#1a7f37';
      setTimeout(() => window.close(), 600);
    });
  </script>
</body>
</html>
